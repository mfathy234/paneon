appId: io.github.mfathy234.paneon
productName: Paneon
directories:
  output: release
files:
  - out/**
  - package.json
  - build/icon.png
extraResources:
  - from: build/paneon-cli.cjs
    to: paneon-cli.cjs
  - from: build/path-edit.ps1
    to: path-edit.ps1
extraFiles:
  - from: build/paneon.cmd
    to: paneon.cmd
asar: true
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  signAndEditExecutable: true
  signExecutable: false
nsis:
  artifactName: Paneon-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
portable:
  artifactName: Paneon-Portable-${version}.${ext}
publish:
  provider: github
  owner: mfathy234
  repo: paneon
